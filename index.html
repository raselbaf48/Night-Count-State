<!doctype html>
<html lang="en" style="background-color:#070d18;color:#f1f5f9;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night Count State</title>
    <meta name="description" content="Military personnel daily night count state and muster management system with consolidated squadron reports, disposal tracking, and official export." />
    <meta name="theme-color" content="#070d18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Night Count" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Night Count State" />
    <meta property="og:description" content="Military personnel daily night count state and muster management system with consolidated squadron reports, disposal tracking, and official export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body style="background-color:#070d18;color:#f1f5f9;margin:0;padding:0;font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;">
    <div id="root">
      <div id="boot-fallback" style="min-height:100vh;display:none;align-items:center;justify-content:center;background:#070d18;color:#cbd5e1;font-family:Arial,sans-serif;padding:16px;text-align:center;">
        <div>
          <div style="font-size:14px;font-weight:700;letter-spacing:0.04em;color:#f8fafc;">Night Count State</div>
          <div id="boot-status" style="font-size:12px;color:#fbbf24;margin-top:6px;">Display could not finish loading. Click Reload App to retry.</div>
          <button id="boot-reload-btn" type="button" onclick="window.location.reload()" style="margin:14px auto 0;padding:8px 16px;background:#10b981;color:#020617;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">Reload App</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        function showBootRecovery() {
          var fallbackEl = document.getElementById('boot-fallback');
          if (fallbackEl) fallbackEl.style.display = 'flex';
        }
        window.addEventListener('error', function () {
          if (document.getElementById('boot-fallback')) showBootRecovery();
        });
        window.addEventListener('unhandledrejection', function () {
          if (document.getElementById('boot-fallback')) showBootRecovery();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
